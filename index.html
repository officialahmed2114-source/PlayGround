  <style>

    button{font:inherit} .app{max-width:1060px;margin:auto}.shell{background:rgba(255,253,248,.96);border:1px solid #fff;border-radius:30px;box-shadow:var(--shadow);overflow:hidden;position:relative}.shell:before{content:"";position:absolute;inset:0 auto 0 0;width:7px;background:linear-gradient(#f6c344,#f27838,#e85840)}
    .topbar{padding:24px 30px 19px;border-bottom:1px solid #f1e7d8;display:flex;align-items:center;justify-content:space-between;gap:18px}.brand{display:flex;align-items:center;gap:14px}.brand-icon{height:54px;width:54px;border-radius:18px;background:#fff1c8;display:grid;place-items:center;font-size:30px;box-shadow:inset 0 0 0 1px #f4dfad}.brand h1{font:700 clamp(20px,3vw,29px)/1.05 'Fredoka',sans-serif;letter-spacing:.2px;color:#754216;margin:0}.brand p{margin:5px 0 0;color:#a06a34;font-size:13px;font-weight:800;letter-spacing:.25px}.tabs{display:flex;gap:8px;padding:5px;border:1px solid #f0e2cc;border-radius:15px;background:#fffaf0}.tab{border:0;border-radius:11px;padding:10px 14px;background:transparent;color:#866d52;font-weight:900;cursor:pointer;transition:.18s;white-space:nowrap}.tab:hover{background:#fff1d2}.tab.active{background:#f2793a;color:#fff;box-shadow:0 4px 10px #ed804c44}
    .content{padding:25px 30px 30px}.view[hidden]{display:none!important}.scores{display:grid;grid-template-columns:1fr auto 1fr;align-items:stretch;gap:14px;margin-bottom:22px}.player{border-radius:20px;padding:14px 18px;display:flex;align-items:center;justify-content:space-between;color:#fff;position:relative;overflow:hidden;transition:.2s;min-height:88px}.player:after{content:"";position:absolute;width:100px;height:100px;border:15px solid #ffffff20;border-radius:50%;right:48px;top:-58px}.player.blue{background:linear-gradient(115deg,#397de0,#43b3db)}.player.purple{background:linear-gradient(115deg,#8e58ca,#b661a9)}.player.active-turn{outline:4px solid #ffd66c;outline-offset:2px;transform:translateY(-2px);box-shadow:0 8px 20px #85522425}.person{display:flex;align-items:center;gap:13px;z-index:1}.avatar{width:53px;height:53px;border-radius:16px;background:#ffffff2e;display:grid;place-items:center;font-size:30px}.player h2{margin:0;font:700 19px 'Fredoka',sans-serif;letter-spacing:.6px}.turn-label{font-size:11px;opacity:.82;font-weight:900;text-transform:uppercase;letter-spacing:1px;display:block;margin-top:3px}.score{z-index:1;text-align:right;font:700 31px 'Fredoka',sans-serif}.score small{display:block;font:800 10px 'Nunito',sans-serif;letter-spacing:1px;opacity:.78;text-transform:uppercase;margin-top:-3px}.versus{align-self:center;background:#fff2d6;color:#ae7a2c;border:1px solid #f4dfaf;border-radius:50%;height:39px;width:39px;display:grid;place-items:center;font:700 13px 'Fredoka',sans-serif}
    .progress-wrap{display:flex;align-items:center;gap:12px;margin:0 2px 20px}.progress-track{height:9px;background:#f3eadc;border-radius:20px;overflow:hidden;flex:1}.progress-fill{height:100%;width:0;background:linear-gradient(90deg,#f6bc3a,#f27838);border-radius:inherit;transition:width .35s}.progress-text{font-size:12px;font-weight:900;color:#8f7c67;white-space:nowrap}.game-grid{display:grid;grid-template-columns:minmax(0,1fr) 238px;gap:18px;align-items:stretch}.question-panel{border:1px solid #f0e3d3;background:#fff;border-radius:23px;padding:24px;min-height:365px;display:flex;flex-direction:column}.question-meta{display:flex;align-items:center;justify-content:space-between;gap:12px}.category{display:inline-flex;align-items:center;gap:7px;border-radius:99px;background:#fff3d4;color:#9e6d1d;padding:7px 12px;font-size:11px;text-transform:uppercase;letter-spacing:.7px;font-weight:1000}.round-label{font-size:12px;color:#a29587;font-weight:900}.question{font:600 clamp(21px,3vw,28px)/1.25 'Fredoka',sans-serif;margin:19px 0 20px;color:#39291e}.answers{display:grid;grid-template-columns:1fr 1fr;gap:11px}.answer{border:2px solid #eee6dc;border-radius:15px;background:#fffdfa;min-height:58px;padding:11px 13px;text-align:left;display:flex;align-items:center;gap:10px;color:#54483d;font-weight:800;cursor:pointer;transition:.16s}.answer:hover:not(:disabled){border-color:#f0bb58;background:#fff9e9;transform:translateY(-2px)}.answer:focus-visible,.btn:focus-visible,.tab:focus-visible{outline:3px solid #47aaa4;outline-offset:3px}.answer:disabled{cursor:default}.key{width:28px;height:28px;display:grid;place-items:center;flex:none;border-radius:9px;background:#f5eee4;color:#9a8975;font-size:12px;font-weight:1000}.answer.correct{border-color:#51bd7b;background:#eaf9ef;color:#207b45}.answer.correct .key{background:#3bac69;color:white}.answer.wrong{border-color:#ed8e81;background:#fff0ee;color:#a3433b}.answer.wrong .key{background:#e8786b;color:white}.answer.dim{opacity:.55}
    .feedback{display:none;margin-top:14px;padding:12px 14px;border-radius:13px;font-size:13px;font-weight:800;line-height:1.45}.feedback.show{display:block;animation:pop .25s ease}.feedback.good{background:#e9f8ee;color:#267347}.feedback.bad{background:#fff0ec;color:#9b4b3b}.feedback strong{font-weight:1000}.question-actions{margin-top:auto;padding-top:18px;display:flex;justify-content:space-between;align-items:center;gap:10px}.hint{font-size:11px;color:#ab9d8c;font-weight:800}.btn{border:0;border-radius:13px;padding:12px 18px;font-weight:1000;cursor:pointer;transition:.15s}.btn:hover{transform:translateY(-2px)}.btn:active{transform:translateY(1px)}.btn-primary{background:linear-gradient(110deg,#f2ae2e,#f27638);color:white;box-shadow:0 5px 0 #d35e2b}.btn-primary:disabled{opacity:.45;cursor:not-allowed;transform:none;box-shadow:none}.btn-quiet{background:#f6eee1;color:#755e42}.side-panel{border-radius:22px;background:#fff7e7;padding:20px;display:flex;flex-direction:column;justify-content:space-between;border:1px solid #f5e5c4}.side-top{text-align:center}.side-illustration{font-size:52px;line-height:1;margin:7px 0 10px;filter:drop-shadow(0 5px 2px #eec76a55)}.side-panel h3{margin:0;font:700 18px 'Fredoka',sans-serif;color:#81541d}.side-panel p{font-size:12px;line-height:1.5;color:#947c5b;margin:8px 0 0;font-weight:700}.turn-chip{margin:19px 0 13px;border-radius:12px;background:#fff;border:1px solid #f3e5cd;padding:10px;text-align:center}.turn-chip span{font-size:10px;color:#aa997f;text-transform:uppercase;font-weight:1000;letter-spacing:1px}.turn-chip strong{display:block;color:#6b4820;font:600 16px 'Fredoka',sans-serif;margin-top:2px}.side-actions{display:grid;gap:8px}.side-actions .btn{width:100%;font-size:12px;padding:10px}.note{font-size:10px;color:#a28b67;text-align:center;font-weight:800}
    .intro{padding:12px 0 4px}.intro-hero{position:relative;overflow:hidden;border-radius:24px;background:linear-gradient(110deg,#f8c64b,#f28a47);padding:27px 30px;color:white;display:flex;align-items:center;justify-content:space-between;gap:18px}.intro-hero:after{content:"𓂀";position:absolute;right:22%;font-size:170px;color:#ffffff17;top:-58px}.intro-hero h2{position:relative;z-index:1;font:700 30px 'Fredoka',sans-serif;margin:0 0 5px}.intro-hero p{position:relative;z-index:1;margin:0;font-weight:800;max-width:520px;opacity:.94;line-height:1.5}.hero-art{z-index:1;font-size:57px;white-space:nowrap}.intro-bottom{display:grid;grid-template-columns:1.1fr .9fr;gap:20px;margin-top:18px}.how-card,.facts-card{background:white;border:1px solid #f0e5d7;border-radius:20px;padding:20px}.how-card h3,.facts-card h3{margin:0 0 13px;font:700 18px 'Fredoka',sans-serif;color:#6e4927}.steps{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.step{background:#fffaf1;border-radius:14px;padding:12px}.step b{display:block;color:#ed8a38;font:700 18px 'Fredoka',sans-serif;margin-bottom:4px}.step span{font-size:11px;color:#8d7a65;line-height:1.4;font-weight:800;display:block}.facts-card ul{margin:0;padding:0;list-style:none;display:grid;gap:9px}.facts-card li{font-size:12px;font-weight:800;color:#7f6a52}.facts-card li strong{color:#b37524}.intro-start{margin-top:18px;display:flex;align-items:center;justify-content:space-between;gap:12px}.intro-start p{font-size:12px;color:#938272;font-weight:800;margin:0}
    .prompt-view{padding:10px 0 4px}.prompt-head{display:flex;justify-content:space-between;align-items:start;gap:15px;margin-bottom:16px}.prompt-head h2{font:700 25px 'Fredoka',sans-serif;color:#70461e;margin:0 0 5px}.prompt-head p{margin:0;font-size:13px;color:#8c7b66;font-weight:700}.codebox{background:#292c35;color:#e8e7ee;padding:22px;border-radius:18px;white-space:pre-wrap;line-height:1.65;font:500 13px/1.65 ui-monospace,SFMono-Regular,Consolas,monospace;max-height:430px;overflow:auto;tab-size:2}.copy-status{font-size:12px;color:#318758;font-weight:900;min-height:19px;margin-top:8px}
    .overlay{position:fixed;inset:0;z-index:10;background:#35291ec9;backdrop-filter:blur(7px);display:none;align-items:center;justify-content:center;padding:20px}.overlay.show{display:flex}.modal{width:min(480px,100%);background:#fffdf8;border-radius:27px;padding:29px;text-align:center;box-shadow:0 25px 90px #22180e66;animation:pop .35s ease}.modal-emoji{font-size:62px}.modal h2{font:700 29px 'Fredoka',sans-serif;color:#76491c;margin:8px 0}.modal p{color:#897763;font-weight:800;line-height:1.5}.final-scores{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:18px 0}.final-score{border-radius:14px;padding:13px;color:#fff;font-weight:1000}.final-score b{display:block;font:700 27px 'Fredoka',sans-serif}.modal .btn{margin-top:4px;min-width:170px}
    @keyframes pop{from{transform:scale(.94);opacity:.2}to{transform:scale(1);opacity:1}} @media(max-width:760px){body{padding:12px 10px 25px}.topbar{align-items:flex-start;flex-direction:column;padding:19px 17px 15px}.tabs{width:100%}.tab{flex:1;padding:9px 5px;font-size:12px}.content{padding:18px 15px 20px}.scores{gap:8px}.player{padding:11px 10px;min-height:74px}.avatar{width:41px;height:41px;font-size:24px;border-radius:13px}.person{gap:8px}.player h2{font-size:15px}.turn-label{font-size:9px}.score{font-size:26px}.game-grid{grid-template-columns:1fr}.question-panel{min-height:350px;padding:18px}.side-panel{display:grid;grid-template-columns:1fr auto;gap:8px;align-items:center;padding:13px 15px}.side-top{text-align:left;display:grid;grid-template-columns:42px 1fr;column-gap:9px;align-items:center}.side-illustration{font-size:35px;grid-row:span 2;margin:0}.side-panel h3{font-size:15px}.side-panel p{display:none}.turn-chip{margin:0;padding:7px}.turn-chip span{font-size:8px}.turn-chip strong{font-size:13px}.side-actions{grid-column:1/-1;grid-template-columns:1fr 1fr}.note{grid-column:1/-1}.intro-hero{padding:22px 18px}.intro-hero h2{font-size:25px}.hero-art{font-size:43px}.intro-bottom{grid-template-columns:1fr}.steps{gap:6px}.step{padding:10px 8px}.step span{font-size:10px}.intro-start{align-items:flex-start;flex-direction:column}.question{margin:15px 0}.answer{font-size:13px;min-height:55px;padding:9px}.hint{display:none}}
    @media(max-width:430px){.brand-icon{width:46px;height:46px;font-size:26px}.brand h1{font-size:22px}.brand p{font-size:11px}.versus{height:31px;width:31px;font-size:11px}.player{padding:9px 8px}.player h2{font-size:13px}.score{font-size:23px}.question{font-size:22px}.answers{gap:8px}.answer{gap:7px;font-size:12px}.key{width:24px;height:24px}.question-actions{padding-top:14px}.btn{padding:11px 14px;font-size:13px}}
    @media(prefers-reduced-motion:reduce){*,*::before,*::after{scroll-behavior:auto!important;animation-duration:.01ms!important;transition-duration:.01ms!important}}
  </style>
</head>
<body>
  <main class="app">
    <section class="shell" aria-label="Egyptian science showdown game">
      <header class="topbar">
        <div class="brand"><div class="brand-icon" aria-hidden="true">🔥</div><div><h1>YOUSSEF <span style="color:#e77b39">vs.</span> ADAM</h1><p>PRIMARY 4 SCIENCE · SOIL, WATER &amp; ANCIENT EGYPT</p></div></div>
        <nav class="tabs" aria-label="Game navigation"><button class="tab active" id="tab-game" type="button" aria-selected="true">🎮 &nbsp;2-Player Battle</button><button class="tab" id="tab-prompt" type="button" aria-selected="false">🤖 &nbsp;AI Game Maker</button></nav>
      </header>
      <div class="content">
        <section class="view" id="view-game" aria-live="polite"></section>
        <section class="view prompt-view" id="view-prompt" hidden>
          <div class="prompt-head"><div><h2>Make your own science showdown!</h2><p>Copy this ready-to-use game brief into your favorite AI game maker.</p></div><button class="btn btn-primary" type="button" id="copy-prompt">📋 Copy game brief</button></div>
          <pre class="codebox" id="game-prompt"></pre><div class="copy-status" id="copy-status" role="status"></div>
        </section>
      </div>
    </section>
  </main>
  <div class="overlay" id="end-overlay" role="dialog" aria-modal="true" aria-labelledby="end-title"><div class="modal"><div class="modal-emoji" id="end-emoji">🏆</div><h2 id="end-title">What a showdown!</h2><p id="end-message"></p><div class="final-scores" id="final-scores"></div><button class="btn btn-primary" type="button" id="play-again">🔁 Play again</button></div></div>
  <script>
    const questionBank = [
      {category:'Soil science',icon:'🌱',q:'Which soil is best for growing most plants?',a:['Clay soil','Loamy soil','Sandy soil','Rocky soil'],correct:1,why:'Loamy soil is a balanced mix that holds water and nutrients while still letting air reach roots.'},
      {category:'Soil science',icon:'🌱',q:'What do we call the tiny pieces of rock and decayed plants that make up soil?',a:['Clouds','Minerals and humus','Salt and sugar','Water vapor'],correct:1,why:'Soil contains mineral particles from rocks and humus made from decayed plants and animals.'},
      {category:'Soil science',icon:'🌱',q:'Which soil lets water pass through it the fastest?',a:['Clay','Loam','Sandy soil','Garden soil'],correct:2,why:'Large spaces between sand grains let water drain through quickly.'},
      {category:'Soil science',icon:'🌱',q:'What is humus?',a:['Bits of plastic in soil','Decayed plant and animal matter','A kind of rock','Water in the ground'],correct:1,why:'Humus is dark, decayed organic matter that helps make soil fertile.'},
      {category:'Water',icon:'💧',q:'What is the process called when liquid water changes into water vapor?',a:['Freezing','Condensation','Evaporation','Precipitation'],correct:2,why:'The Sun warms water and changes it into invisible water vapor. This is evaporation.'},
      {category:'Water',icon:'💧',q:'What happens when water vapor cools and forms tiny droplets in clouds?',a:['Condensation','Melting','Filtration','Runoff'],correct:0,why:'Cooling water vapor changes back into tiny liquid droplets in a process called condensation.'},
      {category:'Water',icon:'💧',q:'Which of these is a safe way to help make drinking water cleaner?',a:['Add soil','Filter and boil it','Leave it in the sun for one minute','Mix it with juice'],correct:1,why:'Filtering removes many particles, and boiling kills many harmful germs.'},
      {category:'Water',icon:'💧',q:'Where does most of the fresh water on Earth stay frozen?',a:['In rivers','In oceans','In glaciers and ice caps','In clouds'],correct:2,why:'Most of Earth’s fresh water is stored as ice in glaciers and ice caps.'},
      {category:'Ancient Egypt',icon:'🏺',q:'Why was the Nile River so important to ancient Egyptians?',a:['It brought fertile soil and water','It made the desert colder','It was full of gold','It stopped the seasons'],correct:0,why:'The Nile flooded and left rich soil behind, helping crops grow in the desert.'},
      {category:'Ancient Egypt',icon:'🏺',q:'What was the dark, fertile soil left by the Nile flood called?',a:['Deshret','Kemet','Papyrus','Siltstone'],correct:1,why:'Kemet means “the black land,” named for the fertile dark soil beside the Nile.'},
      {category:'Ancient Egypt',icon:'🏺',q:'Which plant growing beside the Nile was used to make an early kind of paper?',a:['Cactus','Papyrus','Palm grass','Lotus root'],correct:1,why:'Ancient Egyptians pressed papyrus plant strips together to make a writing material.'},
      {category:'Ancient Egypt',icon:'🏺',q:'What did ancient Egyptian farmers use to lift water from the Nile to their fields?',a:['A shaduf','A compass','A windmill','A steam engine'],correct:0,why:'A shaduf is a simple lever device used to raise water from a river or canal.'},
      {category:'Water',icon:'💧',q:'What is precipitation?',a:['Water falling from clouds','Water soaking into a rock','Water turning to vapor','Water flowing underground'],correct:0,why:'Rain, snow, sleet, and hail are all forms of precipitation.'},
      {category:'Soil science',icon:'🌱',q:'Which soil type feels sticky when wet and holds a lot of water?',a:['Sandy soil','Gravel','Clay soil','Humus'],correct:2,why:'Clay has very tiny particles that pack closely together and hold water.'},
      {category:'Ancient Egypt',icon:'🏺',q:'What is irrigation?',a:['Moving water to crops','Making pottery','Measuring the stars','Building a pyramid'],correct:0,why:'Irrigation is supplying water to land or crops through channels, ditches, or other methods.'}
    ];
    const promptText = `Create a fun, classroom-friendly two-player hot-seat quiz game called “Youssef vs. Adam: Egyptian Science Showdown!” for Primary 4 students.\n\nGAMEPLAY\n- Two players take turns answering 10 multiple-choice questions.\n- Cover soil science, the water cycle and water safety, and Ancient Egypt’s relationship with the Nile.\n- Show four clear answer choices, mark the correct answer after a choice, and explain it in one short, encouraging sentence.\n- Award 100 points for each correct answer; no points are lost for a wrong answer.\n- Alternate turns after every question and show both players’ scores and round progress.\n- At the end, celebrate the winner (or a tie) and offer a replay with a fresh shuffled question set.\n\nDESIGN\nUse a bright, warm Egyptian-adventure theme: golden sand, sunset orange, Nile blue, friendly science icons, rounded cards, large readable text, and joyful animations. Make it responsive for phones, tablets, and computers. Keep controls accessible with keyboard support and clear feedback. Avoid a timer so younger students can think carefully.\n\nCONTENT EXAMPLES\nAsk about loamy soil, humus, sandy soil drainage, evaporation, condensation, clean drinking water, the Nile flood, Kemet, papyrus, and the shaduf. Keep facts accurate and age-appropriate.`;
    document.getElementById('game-prompt').textContent = promptText;
    let state = {questions:[],round:0,scores:[0,0],answered:false,active:true};
    const gameView=document.getElementById('view-game');
    const shuffle = arr => {const a=[...arr];for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};
    function newGame(){state={questions:shuffle(questionBank).slice(0,10),round:0,scores:[0,0],answered:false,active:true};document.getElementById('end-overlay').classList.remove('show');render();}
    function render(){
      const idx=state.round, player=idx%2, q=state.questions[idx], done=idx>=state.questions.length;
      if(done){finishGame();return;}
      gameView.innerHTML=`
        <div class="scores" aria-label="Player scores">
          <div class="player blue ${player===0?'active-turn':''}" id="card-youssef"><div class="person"><div class="avatar" aria-hidden="true">🧑‍🔬</div><div><h2>YOUSSEF</h2><span class="turn-label">${player===0?'YOUR TURN':'Ready!'}</span></div></div><div class="score">${state.scores[0]}<small>points</small></div></div>
          <div class="versus" aria-hidden="true">VS</div>
          <div class="player purple ${player===1?'active-turn':''}" id="card-adam"><div class="person"><div class="avatar" aria-hidden="true">👨‍🔬</div><div><h2>ADAM</h2><span class="turn-label">${player===1?'YOUR TURN':'Ready!'}</span></div></div><div class="score">${state.scores[1]}<small>points</small></div></div>
        </div>
        <div class="progress-wrap"><div class="progress-track" role="progressbar" aria-label="Quiz progress" aria-valuemin="0" aria-valuemax="10" aria-valuenow="${idx}"><div class="progress-fill" style="width:${idx*10}%"></div></div><span class="progress-text">ROUND ${idx+1} OF 10</span></div>
        <div class="game-grid"><section class="question-panel" aria-labelledby="question-title">
          <div class="question-meta"><span class="category">${q.icon} ${q.category}</span><span class="round-label">QUESTION ${String(idx+1).padStart(2,'0')}</span></div>
          <h2 class="question" id="question-title">${q.q}</h2>
          <div class="answers" role="group" aria-label="Choose an answer">${q.a.map((answer,i)=>`<button type="button" class="answer" data-answer="${i}" aria-label="${String.fromCharCode(65+i)}: ${answer}"><span class="key">${String.fromCharCode(65+i)}</span>${answer}</button>`).join('')}</div>
          <div class="feedback" id="feedback" role="status" aria-live="polite"></div>
          <div class="question-actions"><span class="hint">TIP: You can use keys 1–4 to answer</span><button type="button" class="btn btn-primary" id="next-question" disabled>${idx===9?'See final scores':'Next question'} →</button></div>
        </section>
        <aside class="side-panel"><div class="side-top"><div class="side-illustration" aria-hidden="true">${q.category==='Soil science'?'🌱':q.category==='Water'?'💧':'🏺'}</div><h3>Knowledge is power!</h3><p>Think it through, science explorers. Each correct answer earns 100 points.</p></div><div class="turn-chip"><span>Answering now</span><strong>${player===0?'🧑‍🔬 Youssef':'👨‍🔬 Adam'}</strong></div><div class="side-actions"><button class="btn btn-quiet" type="button" id="restart-game">↻ Start over</button><button class="btn btn-quiet" type="button" id="rules-button">📜 How to play</button></div><div class="note">No timer · Take your time!</div></aside></div>`;
      gameView.querySelectorAll('.answer').forEach(button=>button.addEventListener('click',()=>chooseAnswer(Number(button.dataset.answer))));
      document.getElementById('next-question').addEventListener('click',()=>{if(!state.answered)return;state.round++;state.answered=false;render();});
      document.getElementById('restart-game').addEventListener('click',newGame);
      document.getElementById('rules-button').addEventListener('click',()=>{window.alert('Take turns answering 10 multiple-choice science questions. Get 100 points for each correct answer. There is no penalty for a wrong answer, and no timer. The player with the most points wins!');});
    }
    function chooseAnswer(choice){if(state.answered)return;state.answered=true;const q=state.questions[state.round],player=state.round%2,buttons=[...gameView.querySelectorAll('.answer')];buttons.forEach((b,i)=>{b.disabled=true;if(i===q.correct)b.classList.add('correct');else if(i===choice)b.classList.add('wrong');else b.classList.add('dim')});const correct=choice===q.correct;if(correct)state.scores[player]+=100;const feedback=document.getElementById('feedback');feedback.className=`feedback show ${correct?'good':'bad'}`;feedback.innerHTML=`${correct?'✅ Brilliant! +100 points.':'💡 Not quite — no points lost.'} <strong>${q.why}</strong>`;gameView.querySelector('.score').textContent='';gameView.querySelectorAll('.score')[0].innerHTML=`${state.scores[0]}<small>points</small>`;gameView.querySelectorAll('.score')[1].innerHTML=`${state.scores[1]}<small>points</small>`;document.getElementById('next-question').disabled=false;}
    function finishGame(){const [a,b]=state.scores;const title=a===b?'It’s a tie!':a>b?'Youssef wins!':'Adam wins!';document.getElementById('end-title').textContent=title;document.getElementById('end-emoji').textContent=a===b?'🤝':'🏆';document.getElementById('end-message').textContent=a===b?'Amazing teamwork — you both scored '+a+' points!':`${a>b?'Youssef':'Adam'} takes the crown with ${Math.max(a,b)} points. Fantastic science work, both of you!`;document.getElementById('final-scores').innerHTML=`<div class="final-score" style="background:linear-gradient(120deg,#397de0,#43b3db)">🧑‍🔬 Youssef<b>${a}</b></div><div class="final-score" style="background:linear-gradient(120deg,#8e58ca,#b661a9)">👨‍🔬 Adam<b>${b}</b></div>`;document.getElementById('end-overlay').classList.add('show');}
    function switchTab(tab){const game=tab==='game';document.getElementById('view-game').hidden=!game;document.getElementById('view-prompt').hidden=game;document.getElementById('tab-game').classList.toggle('active',game);document.getElementById('tab-prompt').classList.toggle('active',!game);document.getElementById('tab-game').setAttribute('aria-selected',game);document.getElementById('tab-prompt').setAttribute('aria-selected',!game);}
    document.getElementById('tab-game').addEventListener('click',()=>switchTab('game'));document.getElementById('tab-prompt').addEventListener('click',()=>switchTab('prompt'));document.getElementById('play-again').addEventListener('click',newGame);
    document.getElementById('copy-prompt').addEventListener('click',async()=>{const status=document.getElementById('copy-status');try{await navigator.clipboard.writeText(promptText);status.textContent='Copied! Paste the brief into your AI game maker.';}catch{const area=document.createElement('textarea');area.value=promptText;area.style.position='fixed';area.style.opacity='0';document.body.appendChild(area);area.select();const ok=document.execCommand('copy');area.remove();status.textContent=ok?'Copied! Paste the brief into your AI game maker.':'Select and copy the game brief above.';}});
    document.addEventListener('keydown',event=>{if(event.key==='Escape')document.getElementById('end-overlay').classList.remove('show');if(document.getElementById('view-game').hidden||document.getElementById('end-overlay').classList.contains('show'))return;if(!state.answered&&/^[1-4]$/.test(event.key))chooseAnswer(Number(event.key)-1);if(state.answered&&(event.key==='Enter'||event.key===' ')){event.preventDefault();document.getElementById('next-question')?.click();}});
    newGame();
  </script>
</body>
</html>
