<style>
:root{--ink:#172b3a;--muted:#75838a;--paper:#f6f7f1;--white:#fff;--line:#e4e9e3;--green:#4b9b66;--lime:#d8f1b3;--orange:#f2a640;--red:#ed6b62;--purple:#9673ce;--shadow:0 12px 35px #203b4510;--round:24px}
*{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink);font-family:'DM Sans',sans-serif;min-height:100vh}button{font:inherit;color:inherit;cursor:pointer}button:focus-visible{outline:3px solid #78b9d1;outline-offset:3px}#app{min-height:100vh;padding-bottom:38px}.shell{width:min(1120px,calc(100% - 38px));margin:auto}.topbar{height:82px;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid #e6e9e2}.brand{display:flex;align-items:center;gap:12px;font-family:Nunito,sans-serif;font-weight:900;font-size:17px;letter-spacing:-.4px}.brandmark{width:42px;height:42px;background:#d9f0b4;border-radius:15px;display:grid;place-items:center;font-size:23px;transform:rotate(-5deg)}.brand small{display:block;color:#829086;font:700 10px 'DM Sans';letter-spacing:1.6px;text-transform:uppercase;margin-top:1px}.nav-actions{display:flex;gap:9px;align-items:center}.icon-btn,.soft-btn{border:1px solid var(--line);background:#fff;border-radius:14px;padding:10px 14px;font-weight:800;font-size:12px}.icon-btn{width:42px;height:42px;padding:0;font-size:18px}.screen{padding:30px 0}.footer{text-align:center;color:#99a29b;font-size:11px;font-weight:700;letter-spacing:.2px;padding:24px 0 0}.hero{background:#dff1bd;border-radius:32px;min-height:345px;padding:50px 52px;position:relative;overflow:hidden;display:flex;align-items:center}.hero:after{content:'';position:absolute;inset:auto -60px -130px auto;width:400px;height:400px;border:1px solid #b5d788;border-radius:50%;box-shadow:0 0 0 35px #ffffff18,0 0 0 70px #ffffff18}.hero-copy{max-width:570px;position:relative;z-index:1}.eyebrow{font-size:11px;text-transform:uppercase;letter-spacing:2px;color:#577d3b;font-weight:900}.hero h1{font:900 clamp(34px,5vw,57px)/1.04 Nunito,sans-serif;letter-spacing:-2.7px;margin:12px 0 14px}.hero h1 em{font-style:normal;color:#4c813a}.hero p{font-size:15px;line-height:1.65;color:#476044;max-width:490px;margin:0 0 25px}.hero-art{position:absolute;right:9%;top:50%;transform:translateY(-50%);z-index:1;font-size:112px;filter:drop-shadow(0 10px 1px #8b9b6030);animation:float 3s ease-in-out infinite}.hero-art:after{content:'✦';position:absolute;font-size:28px;right:-34px;top:3px;color:#efa946}@keyframes float{50%{transform:translateY(calc(-50% - 8px)) rotate(3deg)}}.primary{border:0;border-radius:14px;background:#243f36;color:#fff;padding:14px 21px;font-weight:900;box-shadow:0 5px 0 #182c26;transition:.15s}.primary:hover{transform:translateY(-2px);box-shadow:0 7px 0 #182c26}.primary:active{transform:translateY(3px);box-shadow:0 2px 0 #182c26}.secondary{border:1px solid #c9d5c4;background:#fff;border-radius:14px;padding:13px 18px;font-weight:900}.section-head{display:flex;align-items:end;justify-content:space-between;margin:33px 0 16px}.section-head h2{font:900 23px Nunito;margin:0;letter-spacing:-.6px}.section-head p{margin:5px 0 0;color:var(--muted);font-size:13px}.stage-grid{display:grid;grid-template-columns:repeat(10,1fr);gap:10px}.stage-dot{aspect-ratio:1;border:1px solid var(--line);border-radius:18px;background:#fff;display:flex;flex-direction:column;justify-content:center;align-items:center;gap:4px;box-shadow:0 3px 0 #e7eae3;transition:.16s;position:relative}.stage-dot:hover:not(:disabled){transform:translateY(-3px)}.stage-dot b{font:900 17px Nunito}.stage-dot span{font-size:10px}.stage-dot:disabled{opacity:.42;cursor:not-allowed}.stage-dot.done:after{content:'★';position:absolute;right:6px;top:4px;font-size:10px;color:#e9a43c}.easy{--tone:#64a873;--tint:#e4f3df}.medium{--tone:#e3a23a;--tint:#fff1d9}.hard{--tone:#e5655c;--tint:#ffebe7}.veryhard{--tone:#9870cb;--tint:#f1e8fb}.hell{--tone:#362933;--tint:#fbe2e0}.stage-dot{border-color:color-mix(in srgb,var(--tone) 23%,white)}.stage-dot b{color:var(--tone)}.stage-dot.active{background:var(--tint)}.below-grid{margin-top:27px;display:grid;grid-template-columns:1.2fr .8fr;gap:16px}.info-card,.tip-card{background:#fff;border:1px solid var(--line);border-radius:22px;padding:20px 22px}.info-card h3,.tip-card h3{margin:0 0 9px;font:900 16px Nunito}.info-card p,.tip-card p{margin:0;color:#6d7d7e;font-size:13px;line-height:1.6}.practice{display:flex;align-items:center;justify-content:space-between;background:#eff5e9;border-color:#dbe8cd}.practice .primary{padding:11px 15px;font-size:12px;white-space:nowrap}.progress-meta{display:flex;justify-content:space-between;align-items:center;font-size:12px;color:#74817e;font-weight:800;margin-bottom:8px}.progress-track{height:7px;background:#e8ece6;border-radius:10px;overflow:hidden}.progress-track i{height:100%;display:block;background:#76b568;border-radius:10px;transition:width .3s}
/* stage view */
.playbar{display:grid;grid-template-columns:1fr auto;align-items:center;gap:18px;margin:4px 0 22px}.playstats{display:flex;gap:9px}.stat{padding:9px 13px;background:#fff;border:1px solid var(--line);border-radius:13px;font-size:12px;font-weight:900;white-space:nowrap}.stat .label{color:#83908b;margin-right:5px}.stage-card{max-width:840px;margin:0 auto;background:#fff;border:1px solid var(--line);border-radius:28px;padding:28px 34px;box-shadow:var(--shadow)}.stage-kicker{display:flex;align-items:center;gap:8px;font-size:11px;font-weight:900;letter-spacing:1.1px;text-transform:uppercase;color:var(--tone)}.difficulty{padding:5px 9px;border-radius:8px;background:var(--tint);font-size:10px}.stage-title{font:900 clamp(25px,3vw,34px)/1.13 Nunito;margin:12px 0 8px;letter-spacing:-1px}.stage-desc{color:#728087;font-size:14px;line-height:1.55;margin:0 0 20px}.prompt-box{border:1px solid #e7ebe4;background:#f8faf6;border-radius:18px;padding:19px;margin:18px 0}.prompt-box h3{font:900 18px Nunito;margin:0 0 7px}.prompt-box p{font-size:13px;line-height:1.55;color:#66767a;margin:0}.options{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:15px 0}.option{min-height:55px;text-align:left;border:1px solid #e2e8e1;background:#fff;border-radius:15px;padding:13px 15px;font-weight:800;transition:.15s}.option:hover:not(:disabled){border-color:#a6c58e;background:#f8fcf3;transform:translateY(-1px)}.option.correct{background:#e5f5e1;border-color:#79bd74;color:#2d753d}.option.wrong{background:#fff0eb;border-color:#ec8b77;color:#ae4a37}.option:disabled{cursor:default}.feedback{display:none;border-radius:14px;padding:13px 15px;font-size:13px;line-height:1.5;margin:12px 0;font-weight:600}.feedback.show{display:block}.feedback.good{background:#e9f6e5;color:#347047}.feedback.bad{background:#fff0ec;color:#9e4939}.feedback strong{font-weight:900}.tip{background:#fff8df;border:1px solid #f3e8b8;border-radius:14px;padding:12px 15px;color:#786335;font-size:12px;line-height:1.5;margin:20px 0}.tip b{color:#826320}.card-bottom{display:flex;justify-content:space-between;align-items:center;gap:15px;margin-top:20px}.card-bottom .progress-track{flex:1}.next-btn{min-width:132px}.hell-screen{background:#26202b;color:#fff}.hell-screen .stage-card{border-color:#5d3b3e;background:#302a34}.hell-screen .prompt-box{background:#3a333d;border-color:#524752}.hell-screen .prompt-box p,.hell-screen .stage-desc{color:#d5c9d1}.hell-screen .option{background:#3d3540;border-color:#64505c;color:white}.hell-screen .option.correct{background:#28533e}.hell-screen .option.wrong{background:#673d3c}.hell-screen .tip{background:#46393a;border-color:#705044;color:#f0d7b3}.hell-screen .stat{background:#38313b;border-color:#5c4b57;color:#fff}.hell-screen .stage-title{color:#fff}.hell-screen .playbar .progress-track{background:#50464f}

2;color:#995b26;font-size:11px;font-weight:800;line-height:1.4;margin-top:10px}.lab-step{font-size:10px;letter-spacing:1.1px;text-transform:uppercase;color:#7a8a7d;font-weight:900}.lab-thermo{display:flex;align-items:center;gap:10px}.lab-thermo input{flex:1;accent-color:#69aa67}.temp-read{font:900 16px Nunito;width:56px}.green-zone{color:#4b9b66;font-size:10px;font-weight:900}.stir-wrap{display:flex;align-items:center;gap:16px}.stir-pad{width:118px;height:118px;border-radius:50%;border:5px solid #dcebd4;background:#f6fbf3;position:relative;touch-action:none;user-select:none;cursor:grab;display:grid;place-items:center;flex:none}.stir-pad:active{cursor:grabbing}.stir-pad:before{content:'';position:absolute;inset:10px;border:2px dashed #9ab88e;border-radius:50%}.stir-pad .stir-arrow{font-size:32px;color:#58965a;animation:spin 3s linear infinite}.stir-pad.wrong{border-color:#ed8e81;background:#fff1ef}.stir-pad.wrong .stir-arrow{color:#d75e53}@keyframes spin{to{transform:rotate(360deg)}}.stir-progress{height:8px;background:#e7eee3;border-radius:9px;overflow:hidden;margin-top:9px}.stir-progress i{display:block;height:100%;background:#70b569;width:0;transition:width .15s}.stir-count{font:900 13px Nunito;margin-top:7px}.mold{display:none;font-size:74px;cursor:pointer;animation:bounce 1.2s infinite alternate}@keyframes bounce{to{transform:translateY(-7px)}}.lab-done{text-align:center;padding:25px 10px}.lab-done .soap-icon{font-size:76px}.confetti{position:fixed;inset:0;pointer-events:none;z-index:10;overflow:hidden}.confetti i{position:absolute;top:-15px;width:9px;height:13px;animation:fall 2.8s linear forwards}@keyframes fall{to{transform:translateY(110vh) rotate(720deg)}}
.equation{display:flex;align-items:center;justify-content:center;flex-wrap:wrap;gap:7px;margin:18px 0}.coeff-control{display:grid;grid-template-columns:30px 35px 30px;grid-template-rows:34px auto;align-items:center;justify-items:center;gap:2px}.coeff-control button{width:29px;height:29px;border:1px solid #dfe7dd;background:#f5f8f2;border-radius:9px;font-weight:900}.coeff-control b{font:900 15px Nunito}.coeff-control small{grid-column:1/4;font-weight:900;font-size:12px;color:#51665a}.eq-sign{font-weight:900;color:#87968a}.sort-row{display:flex;align-items:center;justify-content:space-between;gap:8px;border:1px solid #e8ede7;border-radius:14px;padding:7px 10px 7px 14px;margin:8px 0}.sort-row>b{font-size:13px}.sort-row .options{display:flex;margin:0;gap:5px}.sort-row .option{min-height:0;padding:8px 10px;font-size:11px;width:auto}.stage-card.hell{--tone:#da6158;--tint:#fff0eb}.stage-card.veryhard{--tone:#9870cb;--tint:#f1e8fb}
.certificate{text-align:center;margin:15px auto;padding:36px 30px}.certificate .trophy{font-size:58px;margin-bottom:12px;animation:bounce 1.4s infinite alternate}.certificate .stage-title{font-size:40px}.final-score{display:inline-flex;align-items:center;gap:8px;background:#fff7dc;border-radius:14px;padding:12px 18px;font:900 20px Nunito;margin:8px 0 24px}.final-score small{font:900 9px 'DM Sans';letter-spacing:1px;color:#8e7a43}.cert{max-width:620px;margin:0 auto 24px;padding:12px;background:#f2f6ec;border:1px solid #d5e3c9;border-radius:14px}.cert-inner{position:relative;overflow:hidden;background:#fff;border:1px solid #dce5d8;border-radius:9px;padding:28px 20px;min-height:265px}.cert-top{font-size:10px;font-weight:900;letter-spacing:2px;color:#789267}.cert-caption{margin-top:22px;color:#7a8880;font-size:12px}.cert h2{font:900 28px Nunito;margin:5px 0}.cert p{font-size:12px;color:#75827a;margin:5px}.cert h3{font:900 24px Nunito;color:#55874e;margin:8px}.signature{font:italic 700 16px Georgia;color:#3e6042;margin-top:18px;position:relative;z-index:1}.signature span{display:block;font:700 9px 'DM Sans';color:#8a968e;margin-top:4px}.watermark{position:absolute;inset:50% auto auto 50%;transform:translate(-50%,-50%) rotate(-18deg);font:900 clamp(20px,4vw,36px) Nunito;color:#76a870;opacity:.09;white-space:nowrap;pointer-events:none}.hell-screen .footer{color:#8c7c88}
@media(max-width:760px){.hero{min-height:360px;padding:32px 26px;align-items:flex-start}.hero-copy{max-width:100%}.hero-art{font-size:74px;right:8%;top:auto;bottom:13px;transform:none}.hero-art:after{right:-22px}.stage-grid{grid-template-columns:repeat(5,1fr)}.below-grid{grid-template-columns:1fr}.stage-card{padding:22px 18px}.playbar{grid-template-columns:1fr;gap:10px}.playstats{flex-wrap:wrap}.options{grid-template-columns:1fr}.lab-layout{grid-template-columns:1fr}.lab-visual{min-height:320px}.section-head{align-items:flex-start;gap:10px;flex-direction:column}.brand{font-size:14px}.brandmark{width:38px;height:38px}.shell{width:min(100% - 26px,1120px)}.topbar{height:70px}.nav-actions .soft-btn{padding:9px 10px;font-size:11px}.card-bottom{flex-wrap:wrap}.card-bottom .progress-track{min-width:100%}}

<body>
<div id="app"></div>
<script>
const stages=[
{title:'Heat flows from hot to cold',level:'EASY',kind:'quiz',q:'A hot object is placed beside a colder object. Which way does heat energy flow?',opts:['From the colder object to the hotter one','From the hotter object to the colder one','Both objects lose all their heat','Heat does not move'],a:1,exp:'Heat moves from a higher temperature to a lower temperature until both reach thermal equilibrium. For equal amounts, 100°C and 25°C water reach (100 + 25) ÷ 2 = 62.5°C. Radiation can travel through empty space at about 300,000 km/s.',tip:'Heat always flows from hot to cold.'},
{title:'Three ways heat travels',level:'EASY',kind:'sort',q:'Match each example to the way heat is transferred.',items:[['Metal spoon warming in soup','Conduction'],['Warm air rising above a heater','Convection'],['The Sun warming your face','Radiation']],opts:['Conduction','Convection','Radiation'],exp:'Conduction transfers heat through touching particles; convection moves through liquids and gases; radiation travels as waves and needs no medium. Thermography uses colours to show temperature differences.',tip:'Hot fluids rise and cooler fluids sink—this circulation is a convection current.'},
{title:'Physical or chemical change?',level:'EASY',kind:'quiz',q:'Which change makes a new substance?',opts:['Ice melting','Paper being cut','Iron rusting','Sugar dissolving in water'],a:2,exp:'Rusting is a chemical change: iron reacts with oxygen and forms a new substance. Melting, cutting and dissolving are physical changes.',tip:'Ask: did a new substance form? If yes, it is a chemical change.'},
{title:'Clues that a reaction happened',level:'EASY',kind:'quiz',q:'Which set contains signs of a chemical reaction?',opts:['A precipitate, colour change, gas, or light and heat','A change in shape only','A solid becoming smaller','A substance moving to a new cup'],a:0,exp:'A reaction may form a precipitate, change colour, release gas, or give off light and heat. Silver nitrate forms a white precipitate; zinc makes blue copper sulphate fade; Mg + HCl bubbles; burning Mg gives bright light. CO₂ turns limewater milky.',tip:'Look for evidence—not just a change in size or shape.'},
{title:'Carbohydrate building blocks',level:'EASY',kind:'quiz',q:'Which pair are simple sugars, and which pair are double sugars?',opts:['Glucose & fructose; sucrose & maltose','Sucrose & glucose; fructose & maltose','Maltose & fructose; glucose & sucrose','All four are fats'],a:0,exp:'Glucose and fructose are monosaccharides (single sugar units). Sucrose and maltose are disaccharides (two joined sugar units).',tip:'Mono means one; di means two.'},
{title:'Balance nitrogen and hydrogen',level:'MEDIUM',kind:'balance',q:'Balance: N₂ + H₂ → NH₃',coeff:[1,1,1],answer:[1,3,2],labels:['N₂','H₂','NH₃'],exp:'N₂ + 3H₂ → 2NH₃. There are 2 nitrogen atoms and 6 hydrogen atoms on each side.',tip:'Change coefficients in front of formulas; never change subscripts.'},
{title:'Coefficients vs. subscripts',level:'MEDIUM',kind:'quiz',q:'In 2H₂O, how many hydrogen and oxygen atoms are there altogether?',opts:['2 H and 2 O','4 H and 2 O','2 H and 1 O','4 H and 1 O'],a:1,exp:'The coefficient 2 multiplies every atom in H₂O: 2 × 2 = 4 H atoms and 2 × 1 = 2 O atoms.',tip:'A coefficient multiplies the whole formula. Subscripts stay fixed.'},
{title:'Conservation of mass',level:'MEDIUM',kind:'quiz',q:'222 g of mercury oxide decomposes. It makes 206 g mercury. How much oxygen is released?',opts:['16 g','28 g','206 g','428 g'],a:0,exp:'By conservation of mass, total mass stays the same: 222 g − 206 g = 16 g oxygen. Lavoisier described this law.',tip:'Total mass of reactants = total mass of products.'},
{title:'Choose the right food test',level:'MEDIUM',kind:'quiz',q:'Which test is correctly matched to the nutrient?',opts:['Iodine — starch','Biuret — fats','Sudan III — protein','Benedict — vitamin C'],a:0,exp:'Iodine solution tests for starch (blue-black). Benedict’s tests for reducing sugars; Sudan III for fats; Biuret for proteins.',tip:'Iodine goes blue-black when starch is present.'},
{title:'Nutrients and their elements',level:'MEDIUM',kind:'quiz',q:'Which nutrient group contains nitrogen as well as carbon, hydrogen and oxygen?',opts:['Carbohydrates','Fats','Proteins','Water'],a:2,exp:'Carbohydrates and fats contain carbon, hydrogen and oxygen. Proteins also contain nitrogen.',tip:'Remember C, H, O—and N for proteins.'},
{title:'Balancing reactions',level:'HARD',kind:'balance',q:'Balance both equations. For the second, treat NO₃ as a group.',equations:['CH₄ + O₂ → CO₂ + H₂O','Mg + AgNO₃ → Mg(NO₃)₂ + Ag'],sets:[{labels:['CH₄','O₂','CO₂','H₂O'],answer:[1,2,1,2]},{labels:['Mg','AgNO₃','Mg(NO₃)₂','Ag'],answer:[1,2,1,2]}],exp:'CH₄ + 2O₂ → CO₂ + 2H₂O. Also Mg + 2AgNO₃ → Mg(NO₃)₂ + 2Ag. Count unchanged atoms on both sides.',tip:'Keep polyatomic groups together when they stay unchanged.'},
{title:'Nutrients and health',level:'HARD',kind:'quiz',q:'Which statement is correct?',opts:['Diabetes can involve too little insulin from the pancreas','Cholesterol always improves blood flow','Extra carbohydrate can never be stored','Insulin is made by the lungs'],a:0,exp:'The pancreas produces insulin, which helps control blood glucose. Too much cholesterol can contribute to blocked arteries. Extra carbohydrate can be stored.',tip:'Insulin helps move glucose from blood into body cells.'},
{title:'Soap ingredients & stirring',level:'HARD',kind:'soapmini',q:'Choose the measured amounts, then stir clockwise to start the soap recipe.',exp:'Oils react with sodium hydroxide in saponification to form soap. In real life, caustic soda is dangerous and must only be handled by a teacher.',tip:'Recipe: 100 mL oil + 30 mL caustic soda. Heat gently to 40–50°C, then stir clockwise.'},
{title:'60-second mixed lab sprint',level:'VERY HARD',kind:'timed',seconds:60,questions:[['Heat transfer through a metal spoon is…',['Conduction','Radiation','Convection'],0],['Which test detects protein?',['Biuret','Iodine','Sudan III'],0],['Hot air usually…',['Rises','Sinks','Freezes'],0],['A gas forming can be a sign of…',['Chemical reaction','Physical sorting','Melting only'],0],['Radiation needs…',['No medium','A liquid','A metal'],0],['Which nutrient can contain nitrogen?',['Protein','Fat only','Water'],0]],exp:'You raced through a mixed review of heat, reactions and food tests.',tip:'Read carefully, then trust the evidence.'},
{title:'True or false: lab traps',level:'VERY HARD',kind:'tf',questions:[['You may change a subscript to balance an equation.',false],['Proteins are the body’s major energy source.',false],['Radiation can travel through empty space.',true],['A precipitate is an insoluble solid formed in a reaction.',true],['Convection happens in liquids and gases.',true]],exp:'Balance equations by changing coefficients only. Proteins build and repair; carbohydrates and fats are the main energy sources.',tip:'Never alter a formula’s subscripts when balancing.'},
{title:'Complete the equations',level:'VERY HARD',kind:'complete',sets:[{text:'C + O₂ → ?',opts:['CO₂','CO','C₂O'],a:0,exp:'C + O₂ → CO₂. One carbon atom and two oxygen atoms are conserved.'},{text:'Ca + O₂ → ?',opts:['CaO','CaO₂','Ca₂O'],a:0,exp:'2Ca + O₂ → 2CaO. Calcium oxide forms; coefficients balance the atoms.'}],exp:'Atoms are rearranged in a chemical reaction, not created or destroyed.',tip:'First identify the product, then balance its atoms.'},
{title:'Spot the balancing error',level:'VERY HARD',kind:'error',questions:[['2H₂ + O₂ → 2H₂O',['Balanced','Not balanced'],0],['N₂ + H₂ → 2NH₃',['Balanced','Not balanced'],1],['2Mg + O₂ → 2MgO',['Balanced','Not balanced'],0],['CH₄ + 2O₂ → CO₂ + 2H₂O',['Balanced','Not balanced'],0]],exp:'For N₂ + H₂ → 2NH₃, hydrogen is not balanced (2 on left, 6 on right). It needs 3H₂.',tip:'Count each kind of atom on both sides before deciding.'},

function miniSoapUI(){labStep=labStep||0; if(labStep===0)return `<div class="prompt-box"><h3>Step 1 · Measure the oil</h3><p>Choose the recipe amount for our beaker.</p></div><div class="options">${[50,100,150].map(v=>`<button class="option" onclick="miniAmount('oil',${v})">🫒 ${v} mL oil</button>`).join('')}</div>`;if(labStep===1)return `<div class="prompt-box"><h3>Step 2 · Add caustic soda</h3><p>Choose the correct amount of sodium hydroxide (NaOH).</p></div><div class="lab-alert">⚠️ Caustic soda is dangerous—teacher only in real life!</div><div class="options">${[20,30,50].map(v=>`<button class="option" onclick="miniAmount('soda',${v})">🧪 ${v} mL NaOH</button>`).join('')}</div>`;if(labStep===2)return `<div class="prompt-box"><h3>Step 3 · Stir clockwise ↻</h3><p>Drag around the pad clockwise. Complete one full turn to finish this practice step.</p></div>${stirPadMarkup(1)}`;return `<div class="feedback show good">✓ Recipe prepared! ${stages[12].exp}</div>`}

function stirPadMarkup(turns){return `<div class="stir-wrap"><div class="stir-pad" id="stir-pad" aria-label="Drag clockwise to stir"><span class="stir-arrow">↻</span></div><div><b>Stir clockwise ↻</b><div style="font-size:12px;color:#74817e;margin-top:5px">${turns===1?'1 full rotation':'3 full rotations'} required</div><div class="stir-progress"><i id="stir-fill" style="width:${Math.min(100,stirRadians/(Math.PI*2*turns)*100)}%"></i></div><div class="stir-count" id="stir-count">${Math.min(turns,Math.floor(stirRadians/(Math.PI*2)))} / ${turns} turns</div><div id="stir-warning" style="color:#c84f46;font-weight:900;font-size:11px;margin-top:5px"></div></div></div>`}
function bindStir(turns,isMini){const pad=document.querySelector('#stir-pad');if(!pad)return;pad.onpointerdown=e=>{e.preventDefault();pad.setPointerCapture(e.pointerId);const r=pad.getBoundingClientRect();lastAngle=Math.atan2(e.clientY-(r.top+r.height/2),e.clientX-(r.left+r.width/2))};pad.onpointermove=e=>{if(lastAngle===null)return;const r=pad.getBoundingClientRect(),a=Math.atan2(e.clientY-(r.top+r.height/2),e.clientX-(r.left+r.width/2));let d=a-lastAngle;while(d>Math.PI)d-=Math.PI*2;while(d< -Math.PI)d+=Math.PI*2;lastAngle=a;if(d>0){stirRadians+=d;wrongStir=false;pad.classList.remove('wrong')}else if(d<-.04){wrongStir=true;pad.classList.add('wrong');const warn=document.querySelector('#stir-warning');if(warn)warn.textContent='WRONG DIRECTION! Clockwise only!'}const required=Math.PI*2*turns;const fill=document.querySelector('#stir-fill');if(fill)fill.style.width=Math.min(100,stirRadians/required*100)+'%';const count=document.querySelector('#stir-count');if(count)count.textContent=`${Math.min(turns,Math.floor(stirRadians/(Math.PI*2)))} / ${turns} turns`;if(stirRadians>=required){lastAngle=null;if(isMini){labStep=3;answer(true,stages[12].exp);return}labStep=4;renderSoap(false)}};pad.onpointerup=pad.onpointercancel=()=>{lastAngle=null}}
function renderSoap(isPractice){soapPracticeMode=isPractice;document.body.className='hell-screen';const title=isPractice?'Practice Soap Lab':'Stage 20 · Final Boss';const progress=labStep<4?Math.round(labStep/5*100):100;let control='';let liquidHeight=oilAmount?38:4,liquidColor=labStep>=3?'#d4b766':'#efc780';if(labStep===0)control=`<div class="lab-step">STEP A · MEASURE</div><div class="lab-control"><h4>Add exactly 100 mL of oil</h4><p>Tap the correct measuring cup amount and pour it into the beaker.</p><div class="options">${[50,100,150].map(n=>`<button class="option" onclick="labMeasure('oil',${n})">🫒 ${n} mL</button>`).join('')}</div><div class="lab-alert">Choose 100 mL. Check the measuring marks before pouring.</div></div>`;if(labStep===1)control=`<div class="lab-step">STEP B · ADD CAREFULLY</div><div class="lab-control"><h4>Add 30 mL of caustic soda (NaOH)</h4><p>Measure carefully, then add it to the oil.</p><div class="options">${[20,30,50].map(n=>`<button class="option" onclick="labMeasure('soda',${n})">🧪 ${n} mL NaOH</button>`).join('')}</div><div class="lab-alert">⚠️ Caustic soda is dangerous — teacher only in real life!</div></div>`;if(labStep===2)control=`<div class="lab-step">STEP C · GENTLE HEAT</div><div class="lab-control"><h4>Warm the mixture to 40–50°C</h4><p>Use the burner slider. Keep the thermometer in the green zone.</p><div class="lab-thermo"><span>🔥</span><input id="temp-slider" type="range" min="20" max="70" value="${tempValue}" oninput="tempValue=+this.value;document.querySelector('#temp-number').textContent=tempValue+'°C';document.querySelector('#temp-number').style.color=tempValue>=40&&tempValue<=50?'#4b9b66':tempValue>50?'#d85e54':'#81908b'"><b class="temp-read" id="temp-number">${tempValue}°C</b></div><div class="green-zone">GREEN ZONE · 40–50°C</div><button class="primary" style="margin-top:12px" onclick="labHeat()">Set temperature ✓</button></div>`;if(labStep===3)control=`<div class="lab-step">STEP D · THE KEY MECHANIC</div><div class="lab-control"><h4>Stir clockwise ↻</h4><p>Drag in a circle CLOCKWISE around the beaker. Complete 3 full turns.</p>${stirPadMarkup(3)}</div>`;if(labStep===4)control=`<div class="lab-step">STEP E · POUR, WAIT & CUT</div><div class="lab-control"><h4>${soapState===0?'Pour into the soap mold':soapState===1?'Let the soap set, then tap to cut':'Soap formed!'}</h4><p>${soapState===0?'The mixture has thickened and changed colour and consistency. Pour it into the mold.':soapState===1?'Wait for it to set, then tap the soap to cut a bar.':'A new substance with a new consistency! Great work.'}</p><div style="text-align:center"><div class="mold" id="mold" style="display:inline-block" onclick="moldTap()">${soapState===0?'🫗':soapState===1?'🧼':'🧼'}</div></div></div>`;

let soapState=0;
function labMeasure(which,n){const target=which==='oil'?100:30;if(n!==target){lives--;refreshStats();const msg=document.querySelector('#feedback');msg.className='feedback show bad';msg.textContent=`Measure exactly ${target} mL. Try again.`;if(!lives){lives=3;labStep=0;oilAmount=sodaAmount=0;setTimeout(()=>renderSoap(soapPracticeMode),700)}return}if(which==='oil'){oilAmount=n;labStep=1}else{sodaAmount=n;labStep=2}renderSoap(soapPracticeMode)}
function labHeat(){if(tempValue<40||tempValue>50){lives--;refreshStats();const fb=document.querySelector('#feedback');fb.className='feedback show bad';fb.textContent=tempValue>50?'Too hot! Keep it at 40–50°C. Cool it and try again.':'Not warm enough. Reach the green zone: 40–50°C.';if(tempValue>50){tempValue=35;document.querySelector('#temp-slider').value=35;document.querySelector('#temp-number').textContent='35°C'}if(!lives){lives=3;labStep=0;setTimeout(()=>renderSoap(soapPracticeMode),700)}return}labStep=3;stirRadians=0;renderSoap(soapPracticeMode)}
function moldTap(){if(soapState===0){soapState=1;const l=document.querySelector('.liquid');if(l){l.style.height='70%';l.style.background='#d2bd77'}renderSoap(soapPracticeMode)}else if(soapState===1){soapState=2;score+=100;localStorage.setItem('soap-score',score);renderSoap(soapPracticeMode);confetti()}}
function finishSoap(){answered=true;if(soapPracticeMode){home();return}unlocked=21;localStorage.setItem('soap-unlocked',unlocked);endScreen()}

function endScreen(){stopTimer();document.body.className='';app.innerHTML=`${header()}<main class="screen shell"><section class="stage-card certificate"><div class="trophy">🏆</div><div class="eyebrow">Mission accomplished · Stage 20 complete</div><h1 class="stage-title">You are a Soap Master!</h1><p class="stage-desc">You mastered heat, reactions, equations and nutrition—and made soap in Mister Ahmed’s lab.</p><div class="final-score">⭐ ${finalScore} <small>TOTAL POINTS</small></div><div class="cert"><div class="cert-inner"><div class="cert-top">SCIENCE LAB · CERTIFICATE OF ACHIEVEMENT</div><div class="cert-caption">This certifies that</div><h2>Junior Scientist</h2><p>has successfully completed the Matter Adventure and earned the title of</p><h3>SOAP MASTER</h3><div class="signature">Mister Ahmed Abdelhadi<span>Lab instructor</span></div><div class="watermark">Mister Ahmed Abdelhadi</div></div></div><button class="primary" onclick="confetti();home()">Back to the lab ⌂</button></section>${footer()}</main>`;confetti()}
function confetti(){const c=document.createElement('div');c.className='confetti';for(let i=0;i<75;i++){const p=document.createElement('i');p.style.left=Math.random()*100+'%';p.style.background=['#f2a640','#68ad72','#e5695f','#9976ce','#f4d75e'][i%5];p.style.animationDelay=Math.random()*1.3+'s';p.style.transform=`rotate(${Math.random()*180}deg)`;c.appendChild(p)}document.body.appendChild(c);setTimeout(()=>c.remove(),3600)}
home();
</script>
</body>
</html>
